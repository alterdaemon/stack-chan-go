name: Build Stack-chan Community release images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Validate release and series branch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          npm --prefix firmware run check:release -- "$TAG"
          branch="${TAG%-R*}-mod"
          git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          git merge-base --is-ancestor "$TAG^{commit}" "refs/remotes/origin/$branch"
      - uses: ./.github/actions/setup
        with:
          target-branch: "10.1.0"
      - name: Install embedded Settings dependencies
        run: npm --prefix web ci
      - name: Build and validate both CoreS3 images
        working-directory: ./firmware
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eo pipefail
          source "$HOME/.local/share/xs-dev-export.sh"
          source "$IDF_PATH/export.sh"
          npm run build -- --mode=release
          image="../internal/release-packages/StackChan-Community-$TAG"
          test -s "$image.bin"
          test -s "$image-app.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: stack-chan-community-images
          path: |
            ./internal/release-packages/StackChan-Community-${{ inputs.tag }}.bin
            ./internal/release-packages/StackChan-Community-${{ inputs.tag }}-app.bin
          if-no-files-found: error
