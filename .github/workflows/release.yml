name: Release Stack-chan Community

on:
  push:
    tags:
      - "v*.*.*-R*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release and series branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm --prefix firmware run check:release -- "$TAG"
          branch="${TAG%-R*}-mod"
          git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          git merge-base --is-ancestor "$TAG^{commit}" "refs/remotes/origin/$branch"
      - uses: ./.github/actions/setup
        with:
          target-branch: "10.1.0"
      - name: Install embedded Settings dependencies
        run: npm --prefix web ci
      - name: Build and validate both CoreS3 images
        working-directory: ./firmware
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          source "$HOME/.local/share/xs-dev-export.sh"
          source "$IDF_PATH/export.sh"
          npm run build -- --mode=release
          image="../internal/gpt-live-package/StackChan-Community-$TAG-GPT-Live"
          test -s "$image.bin"
          test -s "$image-app.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: stack-chan-community-images
          path: ./internal/gpt-live-package/*.bin
          if-no-files-found: error

  publish:
    needs: build-release-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stack-chan-community-images
          path: ./release-assets
      - name: Publish Community prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="release-assets/StackChan-Community-$TAG-GPT-Live"
          node firmware/scripts/validate-release.mjs "$TAG" --notes > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$image.bin" "$image-app.bin" \
            --verify-tag --title "Stack-chan Community $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
